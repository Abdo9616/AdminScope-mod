name: Build

on:
  push:
  pull_request:

jobs:
  fabric-1-20-1:
    name: Fabric 1.20.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew ../gradlew
      - run: ./gradlew build --no-daemon

  forge-1-20-1:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew ../gradlew
      - run: ./gradlew build --no-daemon
