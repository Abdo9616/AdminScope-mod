name: Build And Publish Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v0.7.3-Alpha+forge-1.20.1"
        required: true
        type: string
      name:
        description: "Release name"
        required: true
        type: string
      body:
        description: "Changelog / release notes"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as prerelease?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata from tag
        id: meta
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.inputs.name || github.ref_name }}
          RELEASE_BODY: ${{ github.event.release.body || github.event.inputs.body || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || github.event.inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail

          tag="${TAG_NAME}"
          version="${tag#v}"

          if [[ "${version,,}" =~ \+(forge|fabric)-([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            loader="${BASH_REMATCH[1]}"
            minecraft_version="${BASH_REMATCH[2]}"
          else
            echo "The release tag must end in +fabric-1.20.1 or +forge-1.20.1." >&2
            exit 1
          fi

          if [[ "$minecraft_version" != "1.20.1" ]]; then
            echo "This branch only publishes Minecraft 1.20.1 artifacts." >&2
            exit 1
          fi

          dependencies=$(cat <<'EOF'
          cloth-config@*(optional){modrinth:9s6osm5g}{curseforge:348521}
          EOF
          )
          if [[ "$loader" == "fabric" ]]; then
            dependencies=$(cat <<EOF
          fabric-api@*(required){modrinth:P7dR8mSH}{curseforge:306612}
          modmenu@*(optional){modrinth:mOgUt4GM}{curseforge:308702}
          ${dependencies}
          EOF
            )
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "loader=${loader}"
            echo "minecraft=${minecraft_version}"
            echo "module_dir=${loader}"
            echo "java_version=17"
            echo "version_type=alpha"
            echo "name<<RELEASE_NAME"
            printf '%s\n' "${RELEASE_NAME}"
            echo "RELEASE_NAME"
            echo "body<<RELEASE_BODY"
            printf '%s\n' "${RELEASE_BODY}"
            echo "RELEASE_BODY"
            echo "prerelease=${RELEASE_PRERELEASE}"
            echo "dependencies<<DEPENDENCIES"
            printf '%s\n' "${dependencies}"
            echo "DEPENDENCIES"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java_version }}
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew "${{ steps.meta.outputs.module_dir }}/gradlew"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/gradle.properties','**/build.gradle','**/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Build Mod
        working-directory: ${{ steps.meta.outputs.module_dir }}
        run: ./gradlew build --no-daemon

      - name: Locate Release Jar
        id: jar
        run: |
          jar_path="$(find "${{ steps.meta.outputs.module_dir }}/build/libs" -maxdepth 1 -type f -name '*+${{ steps.meta.outputs.loader }}-${{ steps.meta.outputs.minecraft }}.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          if [ -z "$jar_path" ]; then
            echo "No release jar found" >&2
            exit 1
          fi
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub, Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-tag: ${{ steps.meta.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: false
          github-prerelease: ${{ steps.meta.outputs.prerelease }}

          modrinth-id: W8fUtxyA
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-version-type: ${{ steps.meta.outputs.version_type }}
          modrinth-environment: server

          curseforge-id: 1549484
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-name: ${{ steps.jar.outputs.jar_name }}
          curseforge-type: ${{ steps.meta.outputs.version_type }}

          name: ${{ steps.meta.outputs.name }}
          version: ${{ steps.meta.outputs.version }}
          changelog: ${{ steps.meta.outputs.body }}
          loaders: ${{ steps.meta.outputs.loader }}
          game-versions: ${{ steps.meta.outputs.minecraft }}
          java: ${{ steps.meta.outputs.java_version }}

          curseforge-environment: dedicated-server | singleplayer
          files: ${{ steps.jar.outputs.jar_path }}
          dependencies: |
            ${{ steps.meta.outputs.dependencies }}
