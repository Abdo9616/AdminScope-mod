plugins {
    id 'base'
}

description = 'AdminScope multi-loader project for Minecraft 1.20.1'

tasks.register('buildFabric', GradleBuild) {
    dir = file('fabric')
    tasks = ['build']
}

tasks.register('buildForge', GradleBuild) {
    dir = file('forge')
    tasks = ['build']
}

tasks.register('buildAll') {
    dependsOn 'buildFabric', 'buildForge'
}
